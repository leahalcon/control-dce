<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control semanal DCE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4E79">
<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#1a222c;--ink2:#4a5563;--muted:#7a8592;--line:#dde3ea;
  --accent:#1F4E79;--accent-ink:#ffffff;--accent-soft:#e6eef7;--ok:#1f7a4d;--ok-soft:#e3f3ea;--warn:#8a5a00;--warn-soft:#fff3d6;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1418;--card:#171d23;--ink:#e8edf2;--ink2:#b8c2cc;--muted:#8794a1;--line:#2a333d;
    --accent:#6ea8dc;--accent-ink:#0f1418;--accent-soft:#1c2a3a;--ok:#5fc78f;--ok-soft:#173226;--warn:#f0c060;--warn-soft:#3a2d10;
    --shadow:none;color-scheme:dark;}
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--accent);color:#fff;padding:14px 16px}
header .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.85}
main{max-width:1080px;margin:0 auto;padding:16px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.nav button,.nav select{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.nav .title{font-size:17px;font-weight:650;margin:0 4px}
.nav .badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .n{font-size:30px;font-weight:700;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.jor .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.jor .fecha{font-weight:700;font-size:16px}
.jor .est{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);text-transform:uppercase;letter-spacing:.4px}
.jor .est.parcial{background:var(--warn-soft);color:var(--warn)}
.jor dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}
.jor dt{color:var(--muted)}
.jor dd{margin:0}
.jor .obs{margin-top:8px;font-size:13.5px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.dep{margin-bottom:10px}
.dep summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:650}
.dep summary::-webkit-details-marker{display:none}
.dep summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.dep[open] summary::before{transform:rotate(45deg)}
.dep .cnt{margin-left:auto;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.dep .tw{overflow-x:auto;padding:0 8px 8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-top:none;font-weight:650}
td.num{font-variant-numeric:tabular-nums;color:var(--ink2)}
td.ap{font-weight:650}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
footer{max-width:1080px;margin:0 auto;padding:6px 16px 24px;font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.jor dl{grid-template-columns:1fr}.jor dt{margin-top:6px}}
@media print{header{background:none;color:#000}.nav{display:none}.dep{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="in"><h1>Control semanal DCE</h1><span class="sub">División Capacitación y Entrenamiento — DTOCE</span><span class="sub" id="stamp"></span></div></header>
<main>
  <div class="nav">
    <button id="prev" title="Semana anterior">‹</button>
    <select id="sel"></select>
    <button id="next" title="Semana siguiente">›</button>
    <span class="title" id="wtitle"></span>
    <span class="badge" id="wbadge" hidden>Semana actual</span>
  </div>
  <div class="tiles" id="tiles"></div>
  <h2>Jornadas de capacitación de la semana</h2>
  <div id="jornadas"></div>
  <h2>Personal capacitado por dependencia</h2>
  <div id="deps"></div>
</main>
<footer>Fuente: base de datos de tiro de la DCE (BASE_DCE_TIRO.xlsx). Semana = lunes a viernes. Se actualiza los viernes a las 16:00. Solo lectura.</footer>
<script id="dce-state" type="application/json">/*__STATE__*/</script>
<script>
(function(){
  const S = JSON.parse(document.getElementById('dce-state').textContent);
  const W = S.semanas; // ordenadas de la más reciente a la más vieja
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const d = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y,m-1,dd); };
  const fmt = s => { const x=d(s); return `${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')}/${x.getFullYear()}`; };
  const fmtC = s => { const x=d(s); return `${x.getDate()} ${M[x.getMonth()]}`; };
  const dia = s => DIAS[(d(s).getDay()+6)%7];
  const esc = t => String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const g = s => { const x=d(S.generatedAt.slice(0,10)); return `Datos al ${fmt(S.generatedAt.slice(0,10))} ${S.generatedAt.slice(11,16)} hs`; };
  document.getElementById('stamp').textContent = g();

  const sel = document.getElementById('sel');
  W.forEach((w,i)=>{ const o=document.createElement('option'); o.value=i;
    o.textContent = `${fmtC(w.lunes)} – ${fmtC(w.viernes)} ${d(w.viernes).getFullYear()}` + (w.tot.jornadas? ` · ${w.tot.jornadas} jorn.`:' · sin jornadas'); sel.appendChild(o); });
  let idx = Math.max(0, W.findIndex(w=>w.lunes===S.semanaActual));
  try{ const q=new URLSearchParams(location.search).get('semana'); const k=W.findIndex(w=>w.lunes===q); if(k>=0) idx=k; }catch(e){}

  function tile(n,l){ return `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
  function render(){
    const w = W[idx]; sel.value = idx;
    document.getElementById('prev').disabled = idx>=W.length-1;   // más vieja
    document.getElementById('next').disabled = idx<=0;
    document.getElementById('wtitle').textContent = `Semana del ${fmt(w.lunes)} al ${fmt(w.viernes)}`;
    document.getElementById('wbadge').hidden = w.lunes!==S.semanaActual;
    document.getElementById('tiles').innerHTML =
      tile(w.tot.jornadas,'Jornadas') + tile(w.tot.personas,'Personas capacitadas') + tile(w.tot.deps,'Dependencias') + tile(w.tot.ins||'—','Instructores') + tile(w.tot.horas||'—','Horas de capacitación');
    const J = document.getElementById('jornadas');
    if(!w.jornadas.length){ J.innerHTML = '<div class="empty">No hay jornadas cargadas en la base para esta semana.</div>'; }
    else J.innerHTML = w.jornadas.map(j=>`
      <div class="card jor">
        <div class="top"><span class="fecha">${dia(j.fecha)} ${fmt(j.fecha)}</span><span>${esc(j.lugar)}</span><span>${esc(j.tipo)}</span><span class="est ${j.estado==='COMPLETO'?'':'parcial'}">${esc(j.estado||'—')}</span></div>
        <dl>
          <dt>Módulo</dt><dd>${esc(j.modulos)||'—'}</dd>
          <dt>A cargo</dt><dd>${esc(j.aCargo)||'—'}</dd>
          <dt>Instructores</dt><dd>${j.instructores.length? esc(j.instructores.join(', ')) : '—'}</dd>
          <dt>Asistentes</dt><dd>${j.asistentes} ${j.dependencias.length? '· ' + j.dependencias.map(x=>`${esc(x.nombre)} (${x.personas.length})`).join(', ') : ''}</dd>
        </dl>
        ${j.obs? `<div class="obs">${esc(j.obs)}</div>`:''}
      </div>`).join('');
    const D = document.getElementById('deps');
    if(!w.listado.length){ D.innerHTML = '<div class="empty">Sin personal capacitado esta semana.</div>'; }
    else D.innerHTML = w.listado.map((dep,i)=>`
      <details class="card dep" ${i<3?'open':''}>
        <summary>${esc(dep.nombre)}<span class="cnt">${dep.personas.length}</span></summary>
        <div class="tw"><table>
          <thead><tr><th>Jerarquía</th><th>Apellido</th><th>Nombre</th><th>Legajo</th>${w.jornadas.length>1?'<th>Jornada</th>':''}</tr></thead>
          <tbody>${dep.personas.map(p=>`<tr><td>${esc(p.jer)||'—'}</td><td class="ap">${esc(p.ap)}</td><td>${esc(p.nom)}</td><td class="num">${esc(p.leg)||'—'}</td>${w.jornadas.length>1?`<td class="num">${p.fechas.map(f=>fmt(f).slice(0,5)).join(', ')}</td>`:''}</tr>`).join('')}</tbody>
        </table></div>
      </details>`).join('');
  }
  document.getElementById('prev').onclick = ()=>{ if(idx<W.length-1){idx++;render();} };
  document.getElementById('next').onclick = ()=>{ if(idx>0){idx--;render();} };
  sel.onchange = ()=>{ idx=Number(sel.value); render(); };
  render();
})();
</script>
</body>
</html>
